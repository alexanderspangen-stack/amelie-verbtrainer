const WORDS=[{"id":1,"forms":["be","was / were","been"],"de":"sein","accept":["sein"]},{"id":2,"forms":["become","became","become"],"de":"werden","accept":[]},{"id":3,"forms":["begin","began","begun"],"de":"beginnen; anfangen","accept":["anfangen"]},{"id":4,"forms":["bend down","bent down","bent down"],"de":"sich hinunterbeugen","accept":["hinunterbeugen","sich bücken"]},{"id":5,"forms":["blow sth. out","blew","blown"],"de":"etwas auspusten; ausblasen","accept":["auspusten","ausblasen","etwas auspusten","etwas ausblasen"]},{"id":6,"forms":["break","broke","broken"],"de":"brechen; zerbrechen","accept":["brechen","zerbrechen"]},{"id":7,"forms":["bring","brought","brought"],"de":"(mit-, her)bringen","accept":["bringen","mitbringen","herbringen"]},{"id":8,"forms":["build","built","built"],"de":"bauen","accept":[]},{"id":9,"forms":["buy","bought","bought"],"de":"kaufen","accept":[]},{"id":10,"forms":["catch","caught","caught"],"de":"fangen","accept":[]},{"id":11,"forms":["choose","chose","chosen"],"de":"aussuchen; (aus)wählen; sich aussuchen","accept":["aussuchen","auswählen","wählen","sich aussuchen"]},{"id":12,"forms":["come","came","come"],"de":"kommen","accept":[]},{"id":13,"forms":["cost","cost","cost"],"de":"kosten","accept":[]},{"id":14,"forms":["cut","cut","cut"],"de":"schneiden","accept":[]},{"id":15,"forms":["do","did","done"],"de":"tun; machen","accept":["tun","machen"]},{"id":16,"forms":["draw","drew","drawn"],"de":"zeichnen","accept":[]},{"id":17,"forms":["drive","drove","driven"],"de":"(mit dem Auto) fahren","accept":["fahren","auto fahren","mit dem auto fahren"]},{"id":18,"forms":["drink","drank","drunk"],"de":"trinken","accept":[]},{"id":19,"forms":["eat","ate","eaten"],"de":"essen","accept":[]},{"id":20,"forms":["fall","fell","fallen"],"de":"fallen; stürzen; hinfallen","accept":["fallen","stürzen","hinfallen"]},{"id":21,"forms":["feed","fed","fed"],"de":"füttern","accept":[]},{"id":22,"forms":["feel","felt","felt"],"de":"fühlen; sich fühlen","accept":["f :"treffen; sich treffen; kennenlernen","accept":["treffen","sich treffen","kennenlernen"]},{"id":47,"forms":["pay","paid","paid"],"de":"bezahlen","accept":[]},{"id":48,"forms":["put","put","put"],"de":"(etwas wohin) tun; legen; stellen","accept":["tun","legen","stellen","etwas wohin tun"]},{"id":49,"forms":["read","read","read"],"de":"lesen","accept":[]},{"id":50,"forms":["ride","rode","ridden"],"de":"reiten; (Rad) fahren","accept":["reiten","rad fahren","fahrrad fahren","fahren"]},{"id":51,"forms":["ring","rang","rung"],"de":"klingeln; läuten","accept":["klingeln","läuten"]},{"id":52,"forms":["run","ran","run"],"de":"rennen; laufen","accept":["rennen","laufen"]},{"id":53,"forms":["say","said","said"],"de":"sagen","accept":[]},{"id":54,"forms":["see","saw","seen"],"de":"sehen","accept":[]},{"id":55,"forms":["sell","sold","sold"],"de":"verkaufen","accept":[]},{"id":56,"forms":["send","sent","sent"],"de":"schicken; senden","accept":["schicken","senden"]},{"id":57,"forms":["sing","sang","sung"],"de":"singen","accept":[]},{"id":58,"forms":["sit","sat","sat"],"de":"sitzen; sich setzen","accept":["sitzen","sich setzen"]},{"id":59,"forms":["sleep","slept","slept"],"de":"schlafen","accept":[]},{"id":60,"forms":["speak","spoke","spoken"],"de":"sprechen","accept":[]},{"id":61,"forms":["spend","spent","spent"],"de":"(Zeit) verbringen; (Geld) ausgeben","accept":["verbringen","ausgeben","zeit verbringen","geld ausgeben"]},{"id":62,"forms":["stand","stood","stood"],"de":"stehen; sich (hin)stellen","accept":["stehen","sich hinstellen","hinstellen"]},{"id":63,"forms":["swim","swam","swum"],"de":"schwimmen","accept":[]},{"id":64,"forms":["swing","swung","swung"],"de":"schwingen","accept":[]},{"id":65,"forms":["take","took","taken"],"de":"nehmen; bringen; dauern","accept":["nehmen","bringen","dauern"]},{"id":66,"forms":["teach","taught","taught"],"de":"unterrichten","accept":[]},{"id":67,"forms":["tear","tore","torn"],"de":"(ab)reißen","accept":["reißen","abreißen"]},{"id":68,"forms":["tell","told","told"],"de":"erzählen; berichten","accept":["erzählen","berichten"]},{"id":69,"forms":["think","thought","thought"],"de":"denken; glauben","accept":["denken","glauben"]},{"id":70,"forms":["throw","threw","thrown"],"de":"werfen","accept":[]},{"id":71,"forms":["understand","understood","understood"],"de":"verstehen","accept":[]},{"id":72,"forms":["wear","wore","worn"],"de":"tragen (Kleidung)","accept":["tragen","kleidung tragen"]},{"id":73,"forms":["win","won","won"],"de":"gewinnen","accept":[]},{"id":74,"forms":["write","wrote","written"],"de":"schreiben","accept":[]}];
const KEY='amelie_irregular_v2';
const COLS=['Infinitive','Simple Past','Past Participle','Deutsch'];
const today=()=>new Date().toISOString().slice(0,10);
const newState=()=>({stats:{},history:[],settings:{voice:true},current:null});
let state;try{state=JSON.parse(localStorage.getItem(KEY))||newState()}catch(e){state=newState()}state.stats||={};state.history||=[];state.settings||={voice:true};
let tab='home',session=null,lastFeedback=null,answers=['','','',''];
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){console.warn('Speichern nicht möglich',e)}}
const el=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=v=>String(v||'').toLowerCase().trim().replace(/[.,!?]/g,'').replace(/\s+/g,' ').replace(/ß/g,'ss');
function germans(w){const set=new Set([w.de,...(w.accept||[])]);const bits=w.de.split(';').map(x=>x.trim());bits.forEach(b=>{set.add(b);set.add(b.replace(/^\(.*?\)\s*/,'').trim());});return [...set].map(norm).filter(Boolean)}
function checkCell(w,j,val){const v=norm(val);if(!v)return false;if(j===3)return germans(w).includes(v);if(j===1&&w.forms[0]==='be')return ['was / were','was/were','was were','were / was','were/was','were was'].includes(v);return v===norm(w.forms[j]);}
function expected(w,j){return j===3?w.de:w.forms[j]}
function stats(id){return state.stats[id]||{tries:0,wrong:0,streak:0,due:0,last:0}}
function randomShuffle(a){const z=[...a];for(let i=z.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[z[i],z[j]]=[z[j],z[i]]}return z}
function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));if(tab==='home')home();else if(tab==='words')wordlist();else if(tab==='results')results();else setup();}
function goto(t){tab=t;session=null;lastFeedback=null;render()}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>goto(b.dataset.tab));
function mastered(){return WORDS.filter(w=>stats(w.id).streak>=3).length}
function home(){const learned=Object.values(state.stats).filter(s=>s.tries>0).length;const weak=WORDS.filter(w=>stats(w.id).wrong>0&&stats(w.id).streak<3).length;
el('main').innerHTML=`<div class="panel"><h2>Hallo, Amélie!</h2><p>Übe wie in deiner Klassenarbeit: Es wird nur <strong>eine Form</strong> vorgegeben. Die drei anderen schreibst du selbst. Im Lernmodus kommen schwierige Wörter häufiger dran.</p><div class="statgrid"><div class="stat"><strong>${learned}</strong><small>schon geübt</small></div><div class="stat"><strong>${mastered()}</strong><small>dreimal sicher</small></div><div class="stat"><strong>${weak}</strong><small>noch schwierig</small></div></div><div class="toolbar"><button class="primary" id="quick">10 Minuten üben</button><button class="secondary" id="test">Klassenarbeit starten</button></div></div><div class="panel"><h3>So lernst du am besten</h3><p>1. Antwort ohne Vorlage schreiben. 2. Sofort kontrollieren. 3. Fehler anschauen und später noch einmal ohne Hilfe lösen. 4. Am Ende einen echten Prüfungstest machen.</p><div class="notice">Tipp: Für die Prüfung zählt die <strong>englische Schreibweise</strong>. Der Lernmodus übt schwierige Verben, die Klassenarbeit bewertet jede Frage nur einmal.</div></div>`;el('quick').onclick=()=>{tab='learn';render();el('length').value='10';start()};el('test').onclick=()=>goto('exam');}
function setup(){const practice=tab==='learn';const weak=WORDS.filter(w=>stats(w.id).wrong>0&&stats(w.id).streak<3).length;
el('main').innerHTML=`<div class="panel"><h2>${practice?'Lernmodus':'Klassenarbeit'}</h2><p class="muted">${practice?'Falsche Antworten kommen später wieder. Richtig gelöste Verben werden mit der Zeit seltener.':'Jedes Wort wird einmal geprüft, ohne Hilfen und ohne Wiederholung während des Tests.'}</p><div class="row settings"><div class="field"><label for="scope">Wortauswahl</label><select id="scope"><option value="all">Alle 74 Verben</option><option value="0">Block 1: be – fall (20)</option><option value="1">Block 2: feed – let (20)</option><option value="2">Block 3: lie – speak (20)</option><option value="3">Block 4: spend – write (14)</option><option value="weak" ${weak?'':'disabled'}>Nur unsichere Wörter (${weak})</option></select></div><div class="field"><label for="length">Anzahl Aufgaben</label><select id="length"><option value="10">10 Aufgaben</option><option value="20" selected>20 Aufgaben</option><option value="30">30 Aufgaben</option><option value="all">Alle ausgewählten Wörter</option></select></div></div><div class="toolbar"><button class="primary" id="start">${practice?'Lernen starten':'Prüfung starten'}</button></div></div>`;el('start').onclick=start;}
function pool(scope){if(scope==='weak')return WORDS.filter(w=>stats(w.id).wrong>0&&stats(w.id).streak<3);if(scope==='all')return WORDS;const k=Number(scope);return WORDS.slice([0,20,40,60][k],[20,40,60,74][k]);}
function weightedPick(items){const weights=items.map(w=>{const s=stats(w.id);return Math.max(1,s.tries===0?5:5+s.wrong*3-s.streak*2)+(s.due&&s.due<Date.now()?5:0)});const sum=weights.reduce((a,b)=>a+b,0);let r=Math.random()*sum;for(let i=0;i<items.length;i++){r-=weights[i];if(r<=0)return items[i]}return items.at(-1)}
function start(){const scope=el('scope').value;const source=pool(scope);if(!source.length)return;const count=el('length').value==='all'?source.length:Math.min(Number(el('length').value),source.length);const exam=tab==='exam';let list=exam?randomShuffle(source).slice(0,count):[];if(!exam){const remaining=[...source];for(let i=0;i<count;i++){const pick=weightedPick(remaining);list.push(pick);remaining.splice(remaining.indexOf(pick),1)}}session={mode:tab,scope,sourceIds:source.map(w=>w.id),queue:list.map(w=>w.id),index:0,count,log:[],retry:[],retryCounts:{},asked:0,started:Date.now(),phase:'active'};lastFeedback=null;question();}
function givenFor(w){const candidates=[0,1,2,3];return candidates[Math.floor(Math.random()*4)]}
function currentQ(){return session.queue[session.index]}
function question(){if('speechSynthesis' in window)window.speechSynthesis.cancel();if(!session||session.index>=session.queue.length){finish();return}const w=WORDS.find(x=>x.id===currentQ());if(!w){finish();return}if(session.givenIndex===undefined)session.givenIndex=givenFor(w);answers=['','','',''];lastFeedback=null;
const labels=COLS.map((c,j)=>`<div class="cell"><label for="answer${j}">${c}</label>${j===session.givenIndex?`<div class="given">${esc(expected(w,j))}</div>`:`<input class="answerInput" id="answer${j}" autocomplete="off" spellcheck="false" autocapitalize="off" placeholder="Hier schreiben" aria-label="${c}">`}</div>`).join('');
el('main').innerHTML=`<div class="panel"><div class="flex between"><span class="pill">${session.mode==='exam'?'Klassenarbeit':'Lernmodus'}</span><strong>Frage ${session.index+1} / ${session.queue.length}</strong></div><div class="progress"><div style="width:${100*session.index/session.queue.length}%"></div></div><p class="question">Ergänze die <strong>drei fehlenden Felder</strong>.</p><div class="tbl">${labels}</div><div id="feedback"></div><div class="toolbar"><button class="primary" id="check">Antwort kontrollieren</button><button class="subtle" id="stop">Beenden</button></div><p class="hint">${session.mode==='learn'?'Bei Fehlern zeigen wir dir die Lösung und fragen das Verb später erneut.':'Prüfungsmodus: Keine Hinweise vor dem Kontrollieren.'}</p></div>`;
el('check').onclick=check;el('stop').onclick=()=>{if(confirm('Übung beenden und bisherigen Zwischenstand anzeigen?'))finish()};const first=[0,1,2,3].find(j=>j!==session.givenIndex);el('answer'+first)?.focus();document.querySelectorAll('.answerInput').forEach(inp=>inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();const inputs=[...document.querySelectorAll('.answerInput')];const ix=inputs.indexOf(inp);if(ix<inputs.length-1)inputs[ix+1].focus();else check()}}));}
function check(){if(lastFeedback)return;const w=WORDS.find(x=>x.id===currentQ());const gd=session.givenIndex;const correct=[];let allGood=true;for(let j=0;j<4;j++){if(j===gd){correct.push(true);continue}let a=el('answer'+j).value.trim();answers[j]=a;const ok=checkCell(w,j,a);correct.push(ok);if(!ok)allGood=false;el('answer'+j).classList.add(ok?'good':'bad');el('answer'+j).disabled=true}
const mistakes=correct.map((ok,j)=>!ok?COLS[j]:null).filter(Boolean);const rec={id:w.id,given:gd,submitted:[...answers],correct:[...correct],ok:allGood,retry:session.retry.includes(w.id),time:Date.now()};session.log.push(rec);session.asked++;
// Stats update applies only to the first encounter in exam, repeated recall in learning.
const s={...stats(w.id)};s.tries++;s.last=Date.now();if(allGood){s.streak++;s.due=Date.now()+([0,0,2,12,24,72][Math.min(5,s.streak)]||120)*3600*1000}else{s.wrong++;s.streak=0;s.due=Date.now()+2*60*1000;if(session.mode==='learn'){const n=session.retryCounts[w.id]||0;if(n<3){session.retryCounts[w.id]=n+1;session.retry.push(w.id);session.queue.splice(Math.min(session.queue.length,session.index+3),0,w.id)}}}state.stats[w.id]=s;save();lastFeedback=rec;
const fb=el('feedback');fb.className='feedback '+(allGood?'good':'bad');fb.innerHTML=allGood?'<strong>✓ Alles richtig!</strong>':`<strong>Noch nicht ganz richtig.</strong><ul>${mistakes.map(n=>{const j=COLS.indexOf(n);return `<li><strong>${esc(n)}:</strong> ${esc(expected(w,j))}</li>`}).join('')}</ul>`;
let toolbar=el('check');toolbar.textContent='Nächste Frage';toolbar.onclick=()=>{session.index++;delete session.givenIndex;question()};const audioBtn=document.createElement('button');audioBtn.type='button';audioBtn.className='secondary';audioBtn.id='speak';audioBtn.textContent='🔊 Englische Aussprache anhören';audioBtn.onclick=()=>speak(w);toolbar.insertAdjacentElement('afterend',audioBtn);const first=correct.findIndex((ok,j)=>j!==gd&&!ok);if(first>=0)fb.innerHTML+=`<div class="small" style="margin-top:8px">Richtig: <strong>${w.forms.map(esc).join(' – ')}</strong> · ${esc(w.de)}</div>`;
}
function speak(w){
// A recording may only be played after the answer has been checked and shown.
if(!session||!lastFeedback||lastFeedback.id!==w.id)return;
if(!('speechSynthesis' in window)){alert('Sprachausgabe ist in diesem Browser nicht verfügbar.');return}
const synth=window.speechSynthesis;
synth.cancel();
const spoken=w.forms.map(x=>x.replace(/sth\./g,'something')).join('. ');
const utterance=new SpeechSynthesisUtterance(spoken);
utterance.lang='en-GB';
utterance.rate=0.82;
const voices=synth.getVoices();
const en=voices.filter(v=>/^en(?:-|$)/i.test(v.lang));
const british=en.find(v=>/^en-GB$/i.test(v.lang));
const american=en.find(v=>/^en-US$/i.test(v.lang));
const preferred=british||american||en[0];
if(preferred){utterance.voice=preferred;utterance.lang=preferred.lang}
synth.speak(utterance);
}
function finish(){if(!session)return;const completed=session.log.length;const initial=session.log.filter(r=>!r.retry);const accurate=initial.filter(r=>r.ok).length;const missed=[...new Set(initial.filter(r=>!r.ok).map(r=>r.id))];const result={date:new Date().toISOString(),mode:session.mode,count:initial.length,correct:accurate,wrong:missed,log:session.log};state.history.unshift(result);state.history=state.history.slice(0,50);save();session=null;tab='results';render();}
function results(){const h=state.history[0], weak=WORDS.filter(w=>stats(w.id).wrong>0&&stats(w.id).streak<3);const history=state.history.slice(0,8);
el('main').innerHTML=`<div class="panel"><h2>Ergebnisse & Fortschritt</h2>${h?`<p class="muted">Letzter Test: ${new Date(h.date).toLocaleString('de-DE')} · ${h.mode==='exam'?'Klassenarbeit':'Lernmodus'}</p><div class="statgrid"><div class="stat"><strong>${h.correct}/${h.count}</strong><small>beim ersten Versuch richtig</small></div><div class="stat"><strong>${h.count?Math.round(100*h.correct/h.count):0}%</strong><small>Trefferquote</small></div><div class="stat"><strong>${h.wrong.length}</strong><small>Wörter mit Fehlern</small></div></div>${h.wrong.length?`<h3>Diese Wörter waren schwierig</h3>${h.wrong.map(id=>{const w=WORDS.find(x=>x.id===id);return `<div class="entry"><strong>${esc(w.forms.join(' – '))}</strong><div class="small muted">${esc(w.de)}</div></div>`}).join('')}`:'<p class="feedback good">Keine Fehler in dieser Runde!</p>'}`:'<p>Noch keine Ergebnisse. Starte zuerst eine Lernrunde oder Klassenarbeit.</p>'}<div class="divider"></div><h3>Aktuell unsicher: ${weak.length} Wörter</h3>${weak.length?weak.map(w=>`<div class="entry"><div class="flex between"><strong>${esc(w.forms.join(' – '))}</strong><span class="tag bad">${stats(w.id).wrong}× falsch</span></div><div class="small muted">${esc(w.de)}</div></div>`).join(''):'<p>Keine unsicheren Wörter vorgemerkt.</p>'}<div class="toolbar"><button class="primary" id="practiceWeak" ${weak.length?'':'disabled'}>Nur Fehler üben</button></div></div><div class="panel"><h3>Letzte Lerneinheiten</h3>${history.length?`<div style="overflow:auto"><table class="session-table"><thead><tr><th>Datum</th><th>Modus</th><th>Ergebnis</th></tr></thead><tbody>${history.map(a=>`<tr><td>${new Date(a.date).toLocaleDateString('de-DE')}</td><td>${a.mode==='exam'?'Prüfung':'Lernen'}</td><td>${a.correct}/${a.count}</td></tr>`).join('')}</tbody></table></div>`:'Noch keine Einträge.'}<div class="divider"></div><h3>Datensicherung</h3><p class="small muted">Der Fortschritt bleibt in diesem Browser auf diesem Gerät. Beim Wechsel des iPads oder beim Löschen der Browserdaten kann er verloren gehen. Deshalb kannst du ihn sichern.</p><div class="toolbar"><button class="secondary" id="export">Fortschritt exportieren</button><label class="secondary" style="border-radius:11px;padding:11px 17px;font-weight:650;cursor:pointer">Fortschritt importieren<input type="file" id="import" accept="application/json,.json" hidden></label><button class="danger" id="clear">Fortschritt zurücksetzen</button></div></div>`;
el('practiceWeak').onclick=()=>{tab='learn';setup();el('scope').value='weak';el('length').value='20';start()};el('export').onclick=()=>download('amelie-lernstand.json',JSON.stringify({version:2,stats:state.stats,history:state.history},null,2),'application/json');el('import').onchange=importData;el('clear').onclick=()=>{if(confirm('Wirklich alle Lernstände und Ergebnisse unwiderruflich löschen?')){state=newState();save();render()}};
}
function download(name,body,type){const blob=new Blob([body],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function importData(e){const file=e.target.files[0];if(!file)return;const rd=new FileReader();rd.onload=()=>{try{const x=JSON.parse(rd.result);if(!x.stats||!Array.isArray(x.history))throw Error('Falsches Format');if(!confirm('Vorhandenen Lernstand durch diese Sicherung ersetzen?'))return;state.stats=x.stats;state.history=x.history;save();render();alert('Lernstand importiert.')}catch(e){alert('Datei konnte nicht gelesen werden: '+e.message)}};rd.readAsText(file)}
function wordlist(){el('main').innerHTML=`<div class="panel"><h2>Alle 74 Verben aus dem Buch</h2><div class="row"><div class="field"><label for="search">Verb suchen</label><input id="search" placeholder="z. B. went oder gehen"></div><div class="field"><label for="view">Filter</label><select id="view"><option value="all">Alle</option><option value="weak">Schwierige</option><option value="master">Dreimal richtig</option></select></div></div><div id="dictionary"></div></div>`;el('search').oninput=updateDict;el('view').onchange=updateDict;updateDict()}
function updateDict(){const q=norm(el('search').value),f=el('view').value;const list=WORDS.filter(w=>[...w.forms,w.de,...w.accept].some(x=>norm(x).includes(q))&&(f==='all'||(f==='weak'?stats(w.id).wrong>0&&stats(w.id).streak<3:stats(w.id).streak>=3)));el('dictionary').innerHTML=`<p class="small muted">${list.length} Wörter</p><div style="overflow:auto"><table class="session-table"><thead><tr><th>Nr.</th><th>Infinitive</th><th>Simple Past</th><th>Past Participle</th><th>Deutsch</th></tr></thead><tbody>${list.map(w=>`<tr><td>${w.id}</td><td>${esc(w.forms[0])}</td><td>${esc(w.forms[1])}</td><td>${esc(w.forms[2])}</td><td>${esc(w.de)}</td></tr>`).join('')}</tbody></table></div>`}
render();
</script></body></html>
